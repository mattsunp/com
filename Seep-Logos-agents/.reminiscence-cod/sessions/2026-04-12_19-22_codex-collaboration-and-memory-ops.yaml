      - `minutes/`: 人間向け議事録レイヤー

      そのうえで、Codex の作業はこの3層のどこにどう戻すかが重要であり、Codex は `.reminiscence` の代替ではなく、`digest` と `minutes` に戻せる素材を供給する役割になれると説明した。
