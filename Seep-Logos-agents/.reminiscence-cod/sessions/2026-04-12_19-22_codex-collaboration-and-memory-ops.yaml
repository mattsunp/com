  - role: user
    ts: 2026-04-12T16:26:00+09:00
    content: |
      記録の構造について、現状を説明します。.reminiscenceというところで、長期記憶としてセッションの会話全文（要約ではなく全文）をSQliteでDB保存しています。これは検索できるようにもしていますが、膨大なため、digestというディレクトリに議事録作成時にAIエージェントがあとで参照しやすいように各議題のステータスが状態という形でわかるように別途出力しています。AIエージェントが参照して読むものは、このdigestと.reminiscence、minutes/も議事録だけど、こちらは人間があとで読む時にわかりやすい人間用の出力、というかたちで分けています。ここまで理解してもらえそうでしょうか。
